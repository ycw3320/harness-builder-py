[project]
name = "harness-builder-py"
version = "0.1.0"
description = "하네스 빌더 — Claude Code 하네스 구성 데스크톱 앱 (Python)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10",
  "PySide6>=6.6",  # GUI 프레임워크(앱 핵심 런타임). 코어/fs/llm 은 무의존이나 앱 실행엔 필수.
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# 인앱 LLM(BYO 키) — 선택 설치. 미설치 시 오프라인 복사→붙여넣기 흐름 유지.
llm = ["anthropic>=0.69", "keyring>=24"]
# exe 패키징 — 선택 설치. packaging/build_exe.py 실행 시에만 필요.
build = ["pyinstaller>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness_core*", "harness_fs*", "harness_app*", "harness_llm*"]

# 번들 폰트(Pretendard)를 패키지에 포함 — pip install 시 .ttf+OFL 라이선스 동반(한글 드롭아웃 방지)
[tool.setuptools.package-data]
harness_app = ["qt_shell/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["_archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

# 한국어 콘텐츠 문자열(프리셋·템플릿·메시지)은 줄바꿈 시 가독성·골든 바이트 위험 → E501 예외
[tool.ruff.lint.per-file-ignores]
"harness_core/ir/presets.py" = ["E501"]
"harness_core/export/scaffold_templates.py" = ["E501"]
"harness_core/lint/lint.py" = ["E501"]
"harness_app/guides.py" = ["E501"]
"harness_app/view_model.py" = ["E501"]
"harness_app/qt_shell/app.py" = ["E501"]
"harness_llm/prompts.py" = ["E501"]
