[project]
name = "harness-builder-py"
version = "0.1.0"
description = "하네스 빌더 — Claude Code 하네스 구성 데스크톱 앱 (Python)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness_core*", "harness_fs*", "harness_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

# 한국어 콘텐츠 문자열(프리셋·템플릿·메시지)은 줄바꿈 시 가독성·골든 바이트 위험 → E501 예외
[tool.ruff.lint.per-file-ignores]
"harness_core/ir/presets.py" = ["E501"]
"harness_core/export/scaffold_templates.py" = ["E501"]
"harness_core/lint/lint.py" = ["E501"]
